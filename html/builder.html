<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Map Builder</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:rgba(13,17,23,0.5)}
::-webkit-scrollbar-thumb{background:rgba(232,168,56,0.25);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:rgba(232,168,56,0.45)}
*{scrollbar-width:thin;scrollbar-color:rgba(232,168,56,0.25) rgba(13,17,23,0.5)}
body{font-family:'Segoe UI',sans-serif;background:transparent;overflow:hidden}
#builderShell{position:fixed;top:0;left:0;bottom:0;right:0;z-index:99998;pointer-events:none;display:none}
#builderShell.active{display:block}
#builderShell>*{pointer-events:auto}
.builder-topbar{display:flex;align-items:center;gap:14px;padding:12px 24px;background:linear-gradient(180deg,rgba(13,17,23,0.98),rgba(13,17,23,0.90));border-bottom:1px solid rgba(232,168,56,0.30)}
.builder-title{font-family:'Orbitron',sans-serif;font-size:1.25rem;font-weight:700;color:#e8a838;letter-spacing:1.5px}
.builder-info{display:flex;align-items:center;gap:10px;font-family:'Share Tech Mono',monospace;font-size:1rem;color:#bbb}
.builder-model{color:#5ba4f0;font-weight:700}
.builder-divider{color:rgba(255,255,255,0.15)}
.builder-count{color:#999}
.builder-actions{display:flex;align-items:center;gap:10px;margin-left:auto}
.builder-spacer{width:1px;height:22px;background:rgba(232,168,56,0.2);margin:0 4px}
.builder-help{display:flex;align-items:center;gap:18px;padding:10px 24px;background:rgba(13,17,23,0.82);border-bottom:1px solid rgba(255,255,255,0.03);font-family:'Share Tech Mono',monospace;font-size:0.95rem;color:#aaa;overflow-x:auto;white-space:nowrap}
.builder-help kbd{display:inline-block;padding:2px 7px;border:1px solid rgba(232,168,56,0.2);border-radius:3px;background:rgba(13,17,23,0.6);color:#bbb;font-size:0.72rem;margin-right:3px}
.bld-btn{display:flex;align-items:center;gap:8px;padding:10px 20px;background:rgba(13,17,23,0.9);border:1px solid rgba(232,168,56,0.35);border-radius:6px;color:#e8a838;font-size:1rem;cursor:pointer;font-weight:600;letter-spacing:1px}
.bld-btn:hover{background:rgba(232,168,56,0.12);border-color:rgba(232,168,56,0.6)}
.bld-btn.bld-sm{padding:6px 11px;font-size:0.85rem;border-radius:4px}
.bld-btn.bld-danger{color:#d94040;border-color:rgba(217,64,64,0.35)}
.bld-btn.bld-danger:hover{background:rgba(217,64,64,0.12);border-color:rgba(217,64,64,0.6)}
.builder-sidebar{position:fixed;top:112px;left:0;bottom:0;width:400px;background:rgba(13,17,23,0.96);border-right:1px solid rgba(232,168,56,0.2);display:flex;flex-direction:column;transition:transform .2s}
.builder-sidebar.collapsed{transform:translateX(-400px)}
.sidebar-toggle{position:fixed;top:118px;left:400px;z-index:99999;width:24px;height:56px;background:rgba(13,17,23,0.9);border:1px solid rgba(232,168,56,0.3);border-left:none;border-radius:0 6px 6px 0;color:#e8a838;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:left .2s;font-size:0.85rem;pointer-events:auto}
.builder-sidebar.collapsed~.sidebar-toggle{left:0}
.sidebar-header{font-family:'Orbitron',sans-serif;font-size:0.9rem;font-weight:700;color:#e8a838;letter-spacing:1.5px;padding:13px 16px;border-bottom:1px solid rgba(255,255,255,0.06);text-transform:uppercase}
.sidebar-search{padding:10px 16px;border-bottom:1px solid rgba(255,255,255,0.06)}
.sidebar-search input{width:100%;padding:8px 12px;background:rgba(0,0,0,0.45);border:1px solid rgba(255,255,255,0.12);border-radius:4px;color:#ccc;font-family:'Share Tech Mono',monospace;font-size:0.85rem;outline:none}
.sidebar-search input:focus{border-color:#e8a838;box-shadow:0 0 6px rgba(232,168,56,0.12)}
.sidebar-cats{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,0.06)}
.sidebar-cat{padding:7px 14px;border:1px solid rgba(232,168,56,0.25);border-radius:5px;color:#bbb;font-family:'Share Tech Mono',monospace;font-size:0.82rem;cursor:pointer;white-space:nowrap;background:rgba(13,17,23,0.6);text-transform:uppercase;user-select:none}
.sidebar-cat:hover{color:#fff;border-color:rgba(232,168,56,0.5);background:rgba(232,168,56,0.10)}
.sidebar-cat.active{color:#e8a838;border-color:rgba(232,168,56,0.6);background:rgba(232,168,56,0.15)}
.sidebar-body{flex:1;overflow-y:auto;overflow-x:hidden}
.sidebar-list{padding:6px 0}
.sidebar-item{display:flex;align-items:center;gap:12px;padding:10px 18px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.02);color:#bbb;font-family:'Share Tech Mono',monospace;font-size:0.95rem}
.sidebar-item:hover{background:rgba(232,168,56,0.06);color:#e8a838}
.sidebar-item .item-tag{font-size:0.78rem;color:#888;padding:3px 7px;border:1px solid rgba(255,255,255,0.08);border-radius:3px;min-width:40px;text-align:center;text-transform:uppercase;background:rgba(0,0,0,0.3)}
.sidebar-item .item-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.builder-panel{position:fixed;top:115px;right:16px;width:280px;background:rgba(13,17,23,0.94);border:1px solid rgba(232,168,56,0.18);border-radius:8px;overflow:hidden}
.builder-panel .panel-header{font-family:'Orbitron',sans-serif;font-size:0.8rem;font-weight:700;color:#e8a838;letter-spacing:1.2px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.06);text-transform:uppercase}
.builder-panel .panel-body{padding:12px 16px;max-height:340px;overflow-y:auto}
.screen-marker{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;font-size:18px;text-shadow:0 2px 4px rgba(0,0,0,0.95)}
.screen-marker span{padding:4px 8px;border-radius:4px;font-family:'Share Tech Mono',monospace;font-size:12px;font-weight:700;white-space:nowrap;border:1px solid rgba(255,255,255,0.12);letter-spacing:0.5px}
</style></head><body>
<div id="builderShell">
  <div class="builder-topbar">
    <div class="builder-title">MAP BUILDER</div>
    <div class="builder-info"><span id="builderModelName" class="builder-model">-</span><span class="builder-divider">|</span><span id="builderObjCount" class="builder-count">0 objects</span></div>
    <div class="builder-actions">
      <button onclick="bldFetch('exportMap')" class="bld-btn">Export</button>
      <button onclick="bldSend('CLEAR_ALL')" class="bld-btn">Clear</button>
      <button onclick="bldFetch('exitBuilder')" class="bld-btn bld-danger">Exit</button>
    </div>
  </div>
  <div class="builder-help"><span><kbd>LMB</kbd>Pl</span><span><kbd>RMB</kbd>X</span><span><kbd>E</kbd>Pick</span><span><kbd>C</kbd>Cln</span><span><kbd>Del</kbd>Del</span><span><kbd>&larr;&rarr;</kbd>Rot</span><span><kbd>Shift</kbd>H</span><span><kbd>R</kbd>Snp</span><span><kbd>Bksp</kbd>Ex</span></div>
  <div class="builder-sidebar" id="bldrSidebar">
    <div class="sidebar-header">MODEL BROWSER</div>
    <div class="sidebar-search"><input id="bldrSearch" placeholder="Search..." oninput="renderCatalog()"></div>
    <div class="sidebar-cats" id="bldrCats"></div>
    <div class="sidebar-body"><div class="sidebar-list" id="bldrList"></div></div>
  </div>
  <div class="sidebar-toggle" id="bldrToggle" onclick="toggleSidebar()">&#x25C0;</div>
  <div class="builder-panel" id="bldrInfoPanel">
    <div class="panel-header">SELECTED OBJECT</div>
    <div class="panel-body" id="bldrInfoBody"><span style="color:#555;font-size:0.68rem">Click a model or use /spawn.</span></div>
  </div>
</div>
<div id="screenMarkers"></div>
<script src="builder.js"></script>
</body></html>
